<div id="fatal" style="display:none;position:fixed;inset:0;z-index:9999;background:#fff;color:#b00020;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 16px;font:13px/1.5 monospace;white-space:pre-wrap;overflow:auto"></div>
<script>
(function(){try{var t=localStorage.getItem('kdex-theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}
var f=document.getElementById('fatal');window.__stage='html';
function show(t){if(window.__stage==='ready')return;var dk=document.documentElement.getAttribute('data-theme')==='dark';f.style.background=dk?'#121212':'#fff';f.style.color=dk?'#ff8a80':'#b00020';f.style.display='block';f.textContent+=t+'\n\n';if(!document.getElementById('fatalBtn')){var b=document.createElement('button');b.id='fatalBtn';b.textContent='Reload';b.style.cssText='display:block;margin-top:16px;padding:10px 18px;font:600 14px sans-serif;border:1px solid currentColor;background:none;color:inherit;border-radius:10px';b.onclick=function(){location.reload();};f.parentNode.insertBefore(b,f.nextSibling);b.style.position='fixed';b.style.zIndex=10000;b.style.bottom='24px';b.style.left='16px';}}
window.addEventListener('error',function(e){var t=e.target;if(t&&(t.src||t.href)){show('Failed to load: '+(t.src||t.href));}else{show('Error: '+(e.message||'')+' ('+(e.filename||'')+':'+(e.lineno||'')+')\nstage='+window.__stage);}},true);
window.addEventListener('unhandledrejection',function(e){show('Promise error: '+(e.reason&&(e.reason.stack||e.reason.message)||e.reason)+'\nstage='+window.__stage);});
setTimeout(function(){document.documentElement.classList.add('ready');},3500);
setTimeout(function(){if(window.__stage!=='ready')show('Startup is taking too long. stage='+window.__stage);},6000);
})();
</script>

<div id="app" class="app">
  <div id="scrim" class="scrim hidden"></div>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <img class="logo-sm" src="img/logo.png" alt="" width="28" height="28"><span class="brand">KDex Agent</span>
    </div>
    <div class="drawer-actions">
      <button id="dNew" class="btn wide" type="button"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">New chat</span></button>
      <button id="dProjects" class="btn wide" type="button"><svg class="ic"><use href="#i-folder"/></svg><span class="lbl">Projects</span></button>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off"></div>
    <div id="chatList" class="chat-list"></div>
    <div class="drawer-foot"><button id="dSettings" class="btn wide" type="button"><svg class="ic"><use href="#i-gear"/></svg><span class="lbl">Settings</span></button></div>
  </aside>

  <main id="main" class="main">
    <header class="top">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <select id="modelSelect" aria-label="Model"></select>
      <span class="spacer"></span>
      <button id="topFolderBtn" class="icon-btn" type="button" aria-label="Projects"><svg class="ic"><use href="#i-folder"/></svg></button>
      <button id="topNewBtn" class="icon-btn" type="button" aria-label="New chat"><svg class="ic"><use href="#i-plus"/></svg></button>
    </header>

    <div id="ctxBar" class="ctxbar">
      <button id="chipFolder" class="chip" type="button"><svg class="ic"><use href="#i-folder"/></svg><span id="chipFolderName" class="lbl">Add folder</span></button>
      <button id="chipScratch" class="chip hidden" type="button"><svg class="ic"><use href="#i-file"/></svg><span id="chipScratchLbl" class="lbl">Scratch</span></button>
      <button id="chipFiles" class="chip nf" type="button"><svg class="ic"><use href="#i-file"/></svg><span class="lbl">Files</span></button>
      <button id="chipGit" class="chip nf" type="button"><svg class="ic"><use href="#i-branch"/></svg><span id="chipGitLbl" class="lbl">Git</span></button>
      <button id="chipAuto" class="chip nf" type="button"><svg class="ic"><use href="#i-shield"/></svg><span id="chipAutoLbl" class="lbl">Auto</span></button>
      <button id="chipTerm" class="chip nf" type="button"><svg class="ic"><use href="#i-terminal"/></svg><span id="chipTermLbl" class="lbl">Terminal</span></button>
      <button id="chipChanges" class="chip nf" type="button"><svg class="ic"><use href="#i-edit"/></svg><span id="chipChangesLbl" class="lbl">Changes</span></button>
    </div>

    <div id="messages" class="messages"></div>
    <div id="approveBar" class="approve-bar hidden"><span id="approveText" class="lbl"></span><button id="approveAll" class="btn primary sm" type="button"><span class="lbl">Allow all</span></button></div>

    <div id="netLine" class="netline hidden" role="status"></div>
    <div id="thinkMenu" class="menu hidden" role="menu">
      <div class="hd">Thinking (this chat)</div>
      <button type="button" class="it" data-think="off"><b>Off</b><small>Fastest and cheapest</small></button>
      <button type="button" class="it" data-think="low"><b>Low</b><small>Short thinking, small extra cost</small></button>
      <button type="button" class="it" data-think="medium"><b>Medium</b><small>Balanced thinking for most tasks</small></button>
      <button type="button" class="it" data-think="high"><b>High</b><small>Deep thinking, costs more</small></button>
    </div>

    <form id="composer" class="composer">
      <div class="box">
        <div id="chips" class="chips"></div>
        <textarea id="input" rows="1" placeholder="Message KDex Agent" enterkeyhint="send"></textarea>
        <div class="row">
          <button id="attachBtn" class="icon-btn" type="button" aria-label="Attach"><svg class="ic"><use href="#i-clip"/></svg></button>
          <input id="fileInput" type="file" multiple hidden accept="image/*,.txt,.md,.json,.csv,.py,.js,.ts,.jsx,.tsx,.html,.css,.xml,.yml,.yaml,.log,.sh,.java,.kt,.go,.rs,.c,.cpp,.h,.php,.rb,.sql,.ini,.toml,.env,.docx,.xlsx,.pptx,.odt,.ods,.odp">
          <button id="thinkBtn" class="icon-btn tbtn" type="button" aria-haspopup="menu" aria-label="Thinking: Off"><svg class="ic"><use href="#i-bulb"/></svg></button>
          <button id="ctxBtn" class="icon-btn hidden" type="button" aria-label="Context"></button>
          <span class="spacer"></span>
          <button id="sendBtn" class="send" type="submit" aria-label="Send"><svg class="ic"><use href="#i-up"/></svg></button>
        </div>
      </div>
    </form>
  </main>

  <!-- Sheets -->
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div id="sheetGrip" class="sheet-grip" aria-hidden="true"><i></i></div>
      <div class="sheet-head">
        <button id="sheetBack" class="icon-btn hidden" type="button" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
        <div id="sheetTitle" class="sheet-title"></div>
        <button id="sheetClose" class="icon-btn" type="button" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div id="sheetTabs" class="tabs hidden"></div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetFoot" class="sheet-foot hidden"></div>
    </div>
  </section>

  <section id="setup" class="setup hidden"></section>
  <div id="dialog" class="dialog hidden"><div class="dialog-card"><div id="dlgTitle" class="dlg-title"></div><div id="dlgText" class="dlg-text"></div><div class="dlg-actions"><button id="dlgNo" class="btn" type="button"><span class="lbl">Cancel</span></button><button id="dlgAlt" class="btn hidden" type="button"><span class="lbl"></span></button><button id="dlgYes" class="btn primary" type="button"><span class="lbl">OK</span></button></div></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="vendor/capacitor.js"></script>
<script src="vendor/buffer.min.js"></script>
<script src="vendor/lightning-fs.min.js"></script>
<script src="vendor/isomorphic-git.min.js"></script>
<script src="vendor/fflate.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
