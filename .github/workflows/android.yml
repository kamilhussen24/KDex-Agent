name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = test APK, release = signed APK (share directly), release-aab = signed bundle for Google Play"
        type: choice
        options: [debug, release, release-aab]
        default: debug
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      KDEX_JGIT: ${{ vars.KDEX_JGIT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Prepare signing (release only)
        if: env.BUILD_TYPE != 'debug'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v. Add the 4 signing secrets (see README) or run with build_type=debug."; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kdex.keystore"
          echo "KDEX_KEYSTORE=$RUNNER_TEMP/kdex.keystore" >> "$GITHUB_ENV"
          echo "KDEX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KDEX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KDEX_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Patch Android project
        run: node scripts/prepare-android.mjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          case "$BUILD_TYPE" in
            release) ./gradlew assembleRelease --no-daemon ;;
            release-aab) ./gradlew bundleRelease --no-daemon ;;
            *) ./gradlew assembleDebug --no-daemon ;;
          esac

      - name: Collect APK
        run: |
          mkdir -p out
          if [ "$BUILD_TYPE" = "release-aab" ]; then
            f=$(find android/app/build/outputs/bundle -name "*.aab" | head -n1)
            cp "$f" "out/KDex-Agent-release.aab"
          else
            f=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
            cp "$f" "out/KDex-Agent-${BUILD_TYPE}.apk"
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: KDex-Agent-${{ env.BUILD_TYPE }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
